name: Daily Signal Generation

on:
  schedule:
    # GitHub 예약(cron)은 best-effort라 지연·누락이 잦다. 평일 장 마감(15:30 KST)
    # 후 여러 번 시도해 한 번이라도 성공시키는 전략. 아래 'gate' 스텝이 오늘 분이
    # 이미 생성됐으면 재시도를 즉시 skip하므로 중복 커밋·불필요한 연산이 없다.
    #   (off-peak :35 사용 — 정각/30분은 GitHub 부하로 누락 확률↑)
    - cron: '35 9 * * 1-5'   # 18:35 KST  (주 트리거)
    - cron: '35 11 * * 1-5'  # 20:35 KST  (재시도 1)
    - cron: '35 13 * * 1-5'  # 22:35 KST  (재시도 2)
  workflow_dispatch:  # 수동 실행 가능

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit·push 권한
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 오늘(최근 거래일) 분이 이미 daily_signals.json 에 있으면 이후 스텝을 모두 skip.
      # compute_daily_signals.py 의 latest_trading_date_no_api() 와 동일한 로직
      # (runner=UTC 기준 최근 평일)으로 as_of 를 비교해 재시도를 idempotent 하게 만든다.
      - name: Gate — skip if today already generated
        id: gate
        run: |
          # script 의 latest_trading_date_no_api() 와 동일: runner=UTC now 기준 최근 평일
          DOW=$(date -u +%u)            # 1=Mon .. 7=Sun
          BACK=0
          [ "$DOW" -ge 6 ] && BACK=$((DOW - 5))   # 토→1, 일→2 만큼 직전 금요일로
          LATEST=$(date -u -d "-$BACK day" +%Y%m%d)
          CURRENT=$(python3 -c "import json;print(json.load(open('_workspace/08_signals/daily_signals.json')).get('as_of',''))" 2>/dev/null || echo "")
          echo "latest trading day=$LATEST | current as_of=$CURRENT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "이미 $LATEST 분 생성됨 — skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache KRX responses (persistent disk cache)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: _workspace/lib/.krx_cache
          key: krx-cache-${{ github.run_id }}
          restore-keys: |
            krx-cache-

      - name: Setup Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily signals
        if: steps.gate.outputs.run == 'true'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FNSPACE_API_KEY: ${{ secrets.FNSPACE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GITHUB_TOKEN_PAT: ${{ secrets.GH_TOKEN_PAT }}
        run: |
          python3 _workspace/08_signals/compute_daily_signals.py

      - name: Commit + push if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _workspace/08_signals/daily_signal_queue.md \
                  _workspace/08_signals/daily_signals.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "daily: auto signal $(date +%Y-%m-%d)"
            git push
          fi
